<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball UI starter</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #f3efe5; color: #2b2620; font: 15px/1.5 Georgia, serif; }
  main { min-height: 100vh; display: grid; place-content: center; gap: 22px; justify-items: center; padding: 0 16px; }
  p { max-width: 520px; text-align: center; color: #7a7064; }
  pinball-mute { --pb-size: 72px; }
</style>
</head>
<body>
<main>
  <pinball-mute label="Mute"></pinball-mute>
  <p>The smallest whole example: a switch built on core.js with no photographs. The lane is worked out in the shader; the ball and the sound come from the core.</p>
</main>
<script src="core.js"></script>
<script>
// <pinball-mute>: a ball in a short lane. Press it and a solenoid kicks the ball to the other end, where a lamp lights.
// Everything is measured in "plate pixels", the coordinates the shader draws in, as if there were a 600 x 240 photograph.
(() => {
'use strict';
const K = window.PinballKit, { clamp, Spring } = K;
const BOX = [20, 20, 560, 200];            // the element's box, in plate pixels
const PAD = 60, Y = 120, OFF = 120, ON = 480, R = 62, TRAVEL = ON - OFF;

// The body is drawn in GLSL: scene(p) says what is at plate point p. In the shipped controls scene() samples two photographs
// (lamp off and lamp on) and mixes them by uLamp; here it is a red rim, a teal floor and a round lamp, worked out from shapes.
const FS = K.glsl.head + K.glsl.ball + `
uniform float uLamp;
vec4 scene(vec2 p){
  float rim = pill(p, vec2(300., 120.), vec2(280., 100.)), floor_ = pill(p, vec2(300., 120.), vec2(256., 76.));
  float a = clamp(.5 - rim / (uPx * 1.5), 0., 1.);
  vec3 c = vec3(.72, .08, .06);                                        // the red rim
  if (floor_ < 0.) c = vec3(.09, .40, .38) * (1. - .35 * smoothstep(-20., 0., floor_));
  float lens = length(p - vec2(${ON}., ${Y}.)) / 58.;
  if (lens < 1.) c = mix(vec3(.80, .74, .58), lampCol(uLamp) * 1.3, uLamp * (1. - .5 * lens));
  float drop = (1. - smoothstep(-8., 40., pill(p - vec2(8., 14.), vec2(300., 120.), vec2(280., 100.)))) * .3;
  return vec4(c * a, a) + vec4(0., 0., 0., drop) * (1. - a);
}
void main(){ vec2 p = uView.xy + vUv * uView.zw; gl_FragColor = ball(p, shadow(scene(p), p)); }`;
let prog;
const program = () => { if (prog === undefined) { try { prog = K.program(K.glsl.vs, FS); } catch (e) { console.error(e.message); prog = null; } } return prog; };

class PinballMute extends K.Base {
  static observedAttributes = ['checked'];
  static formAssociated = true;
  static css = `:host{display:inline-block;position:relative;height:var(--pb-size,36px);aspect-ratio:${BOX[2]}/${BOX[3]}}
    button{all:unset;position:absolute;inset:0;border-radius:999px;cursor:pointer}
    button:focus-visible{outline:2px solid #e8961e;outline-offset:3px}
    canvas{position:absolute;pointer-events:none;top:${-100 * PAD / BOX[3]}%;left:${-100 * PAD / BOX[2]}%;width:${100 * (BOX[2] + 2 * PAD) / BOX[2]}%;height:${100 * (BOX[3] + 2 * PAD) / BOX[3]}%}`;
  render() { return '<canvas></canvas><button type="button" role="switch"></button>'; }
  formValue() { return this.on ? 'on' : null; }
  setup() {
    this.on = this.hasAttribute('checked'); this.s = this.on ? 1 : 0; this.v = 0; this.roll = 0; this.lamp = this.s;
    this.bump = new Spring(0, 1400, 34); this.cv = this.$('canvas'); this.btn = this.$('button');
    this.btn.setAttribute('aria-label', this.getAttribute('label') || 'Mute'); this.btn.setAttribute('aria-checked', String(this.on));
    this.btn.addEventListener('click', () => this.set(!this.on, true));
  }
  get checked() { return this.on; } set checked(v) { this.set(!!v, false); }
  set(on, user) {
    if (on === this.on) return;
    this.on = on; this.btn.setAttribute('aria-checked', String(on)); this.syncForm();
    if (K.calm) { this.s = on ? 1 : 0; this.v = 0; } else { this.v += (on ? 1 : -1) * K.feel.kick; this.fx.kick(); }
    if (user) this.emit('change', { checked: on });
    this.dirty = true; K.start();
  }
  // one small time step: pulled toward its end, a wall with a bounce, then a damped rock in the seat
  step(h) {
    const to = this.on ? 1 : 0, d = this.s - to, w = K.TAU * K.feel.rock;
    const a = Math.abs(d) < 0.12 ? -w * w * d - 2 * K.feel.settle * w * this.v : (this.on ? 1 : -1) * K.feel.tilt - this.v;
    this.v += a * h; const was = this.s; this.s += this.v * h;
    for (const [edge, sign] of [[1.04, 1], [-0.04, -1]]) if (sign * (this.s - edge) > 0) { this.s = edge; if (sign * this.v > 0) { this.fx.clack(Math.abs(this.v) / 5); this.bump.v += sign * 200; this.v *= -K.feel.bounce; } }
    this.roll += (this.s - was) * TRAVEL / R;
    const lit = this.s > 0.92; if (lit && this.lamp < 0.05 && this.on) { this.fx.relay(true); this.fx.chime(0, 0.24); }
    this.lamp += ((this.on && lit ? 1 : 0) - this.lamp) * (1 - Math.exp(-h / 0.06));
  }
  frame(dt) {
    const to = this.on ? 1 : 0, busy = Math.abs(this.s - to) > 4e-4 || Math.abs(this.v) > 4e-3 || Math.abs(this.lamp - to) > 2e-3 || !this.bump.idle;
    if (busy && dt > 0) { for (let n = Math.ceil(dt / 0.004), h = dt / n; n--;) this.step(h); this.bump.step(dt); this.fx.roll(Math.abs(this.v)); }
    if (busy || this.dirty) this.draw();
    this.dirty = false; return busy;
  }
  draw() {
    const p = program(); if (!p) return;
    const dpr = Math.min(3, devicePixelRatio || 1), w = Math.round(this.cv.clientWidth * dpr), h = Math.round(this.cv.clientHeight * dpr); if (!w) return;
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; }
    const vw = BOX[2] + 2 * PAD, vh = BOX[3] + 2 * PAD;
    K.paint(p, w, h, (g, u) => {
      g.uniform4f(u.uView, BOX[0] - PAD - this.bump.x, BOX[1] - PAD, vw, vh);
      g.uniform3f(u.uBall, OFF + this.s * TRAVEL, Y, R); g.uniform1f(u.uRoll, this.roll); g.uniform1f(u.uPx, vw / w);
      g.uniform1f(u.uLamp, clamp(this.lamp)); g.uniform3f(u.uPage, 0.953, 0.937, 0.898);
    }, this.cv);
  }
}
K.define('pinball-mute', PinballMute);
})();
</script>
</body>
</html>
